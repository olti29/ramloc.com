<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMLOC | FOOTBALL EDITION 1</title>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --pink: #f8c8dc;
            --gray: #f4f4f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Helvetica', 'Arial', sans-serif; }

        body { background-color: var(--white); color: var(--black); text-transform: uppercase; overflow-x: hidden; }

        /* Header style Corteiz */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--black);
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        .logo { font-size: 2rem; font-weight: 900; letter-spacing: -2px; }
        nav a { margin-left: 20px; text-decoration: none; color: black; font-weight: bold; font-size: 0.9rem; }

        /* Hero Section */
        .marquee {
            background: var(--black);
            color: var(--white);
            padding: 10px 0;
            font-size: 0.8rem;
            overflow: hidden;
            white-space: nowrap;
        }

        /* Grid Produits */
        .shop-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2px;
            background-color: var(--black); /* Crée les lignes de séparation */
            border-bottom: 2px solid var(--black);
        }

        .product-card {
            background: var(--white);
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover { background: var(--gray); }

        .product-image {
            width: 100%;
            height: auto;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .product-info { margin-top: 15px; }
        .product-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 5px; }
        .product-price { font-size: 1rem; opacity: 0.7; }

        /* Specific Colors */
        .bg-pink { background-color: #fff0f5; }

        /* Footer */
        footer { padding: 50px 20px; text-align: center; font-size: 0.7rem; letter-spacing: 2px; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .shop-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="marquee">
        EDITION 1 : FOOTBALL — RAMLOC WORLDWIDE — NO RESTOCK — EDITION 1 : FOOTBALL — RAMLOC WORLDWIDE — NO RESTOCK
    </div>

    <header>
        <div class="logo">RAMLOC</div>
        <nav>
            <a href="#">SHOP</a>
            <a href="#">CART (0)</a>
        </nav>
    </header>

    <main class="shop-container">
        <div class="product-card">
            <img src="balotelli-blanc.png.jpeg" alt="RAMLOC X BALOTELLI" class="product-image">
            <div class="product-info">
                <p class="product-title">RAMLOC X BALOTELLI (WHITE)</p>
                <p class="product-price">45.00 EUR</p>
            </div>
        </div>

        <div class="product-card" style="background-color: #1a1a1a; color: white;">
            <img src="neymar-noir.png.jpeg" alt="RAMLOC X NEYMAR" class="product-image">
            <div class="product-info">
                <p class="product-title">RAMLOC X NEYMAR (BLACK)</p>
                <p class="product-price">45.00 EUR</p>
            </div>
        </div>

        <div class="product-card bg-pink">
            <img src="pogba-rose.png.jpeg" alt="RAMLOC X POGBA" class="product-image">
            <div class="product-info">
                <p class="product-title">RAMLOC X POGBA (PINK)</p>
                <p class="product-price">45.00 EUR</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 RAMLOC LABORATOIRES. TOUS DROITS RÉSERVÉS.</p>
    </footer>

</body>
</html>
