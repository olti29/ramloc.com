<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMLOC | UNDERGROUND DIVISION</title>
    <style>
        :root { --black: #000; --white: #fff; --grey: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        body { background: var(--white); color: var(--black); text-transform: uppercase; overflow-x: hidden; }

        /* HEADER & MENU */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid black; position: sticky; top: 0; background: white; z-index: 100; }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .burger-menu { cursor: pointer; display: flex; flex-direction: column; gap: 5px; width: 30px; }
        .burger-menu span { width: 100%; height: 3px; background: black; transition: 0.3s; }
        
        /* SIDE MENU */
        .side-nav { position: fixed; left: -100%; top: 0; width: 300px; height: 100%; background: black; color: white; z-index: 1001; transition: 0.5s; padding: 50px 20px; }
        .side-nav.active { left: 0; }
        .side-nav a { display: block; color: white; text-decoration: none; font-size: 1.5rem; margin-bottom: 20px; font-weight: bold; }
        .side-nav a:hover { color: grey; }
        .close-menu { position: absolute; top: 20px; right: 20px; cursor: pointer; font-size: 1.2rem; }

        /* GRID SYSTEM - IMAGES ALIGNÉES */
        .shop-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); background: black; gap: 2px; }
        .product-card { background: white; padding: 40px 20px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Box Image Uniforme */
        .image-container { 
            width: 100%; 
            aspect-ratio: 1/1; 
            background: #f9f9f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 20px; 
            cursor: zoom-in;
            overflow: hidden;
        }
        .product-image { 
            max-width: 90%; 
            max-height: 90%; 
            object-fit: contain; /* Garde les proportions et centre dans le blanc */
            transition: transform 0.5s ease;
        }
        .image-container:hover .product-image { transform: scale(1.05); }

        /* BOUTONS */
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 15px; font-weight: bold; cursor: pointer; border: 2px solid black; text-transform: uppercase; font-size: 0.8rem; transition: 0.2s; }
        .btn-black { background: black; color: white; }
        .btn-white { background: white; color: black; }
        .btn:hover { opacity: 0.7; }

        /* MODAL ZOOM */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal img { max-width: 80%; max-height: 80%; object-fit: contain; box-shadow: 0 0 50px rgba(0,0,0,0.1); }

        .marquee { background: black; color: white; padding: 8px; font-size: 0.7rem; white-space: nowrap; overflow: hidden; }

        #cart-count { background: red; color: white; padding: 2px 6px; border-radius: 50%; font-size: 0.7rem; vertical-align: top; }
    </style>
</head>
<body>

    <div class="marquee">RAMLOC LABORATOIRES — NO RESTOCK — EDITION 1 : FOOTBALL — 10 PCS PER SIZE</div>

    <header>
        <div class="nav-left">
            <div class="burger-menu" onclick="toggleMenu()">
                <span></span><span></span><span></span>
            </div>
            <div class="logo" style="font-size: 1.5rem; font-weight: 900;">RAMLOC</div>
        </div>
        <div onclick="toggleCart()" style="cursor:pointer; font-weight:bold;">
            CART <span id="cart-count">0</span>
        </div>
    </header>

    <nav class="side-nav" id="sideNav">
        <div class="close-menu" onclick="toggleMenu()">[ CLOSE ]</div>
        <a href="#">NEW DROPS</a>
        <a href="#">SHOOTING / LOOKBOOK</a>
        <a href="#">ARCHIVES</a>
        <br>
        <p style="font-size: 0.7rem; margin-bottom: 10px; color: grey;">SOCIALS</p>
        <a href="https://tiktok.com/@toncompte" style="font-size: 1rem;">TIKTOK</a>
        <a href="https://instagram.com/toncompte" style="font-size: 1rem;">INSTAGRAM</a>
    </nav>

    <main class="shop-container">
        <div class="product-card">
            <div class="image-container" onclick="openZoom('Sans titre.jpeg')">
                <img src="Sans titre.jpeg" class="product-image" alt="Balotelli">
            </div>
            <h3>RAMLOC X BALOTELLI</h3>
            <p>40.00 EUR</p>
            <select id="size-Balotelli" style="width:100%; padding:10px; margin-top:10px; border:1px solid black;">
                <option>XS (10 LEFT)</option><option>S (10 LEFT)</option>
                <option>M (10 LEFT)</option><option>L (10 LEFT)</option><option>XL (10 LEFT)</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-white" onclick="addToCart('Balotelli')">ADD TO CART</button>
                <button class="btn btn-black" onclick="buyNow('Balotelli')">BUY NOW</button>
            </div>
        </div>

        <div class="product-card">
            <div class="image-container" onclick="openZoom('neymar-noir.pnj.jpeg')">
                <img src="neymar-noir.pnj.jpeg" class="product-image" alt="Neymar">
            </div>
            <h3>RAMLOC X NEYMAR</h3>
            <p>40.00 EUR</p>
            <select id="size-Neymar" style="width:100%; padding:10px; margin-top:10px; border:1px solid black;">
                <option>XS (10 LEFT)</option><option>S (10 LEFT)</option>
                <option>M (10 LEFT)</option><option>L (10 LEFT)</option><option>XL (10 LEFT)</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-white" onclick="addToCart('Neymar')">ADD TO CART</button>
                <button class="btn btn-black" onclick="buyNow('Neymar')">BUY NOW</button>
            </div>
        </div>

        <div class="product-card">
            <div class="image-container" onclick="openZoom('pogba-rose.pnj.jpeg')">
                <img src="pogba-rose.pnj.jpeg" class="product-image" alt="Pogba">
            </div>
            <h3>RAMLOC X POGBA</h3>
            <p>40.00 EUR</p>
            <select id="size-Pogba" style="width:100%; padding:10px; margin-top:10px; border:1px solid black;">
                <option>XS (10 LEFT)</option><option>S (10 LEFT)</option>
                <option>M (10 LEFT)</option><option>L (10 LEFT)</option><option>XL (10 LEFT)</option>
            </select>
            <div class="btn-group">
                <button class="btn btn-white" onclick="addToCart('Pogba')">ADD TO CART</button>
                <button class="btn btn-black" onclick="buyNow('Pogba')">BUY NOW</button>
            </div>
        </div>
    </main>

    <div class="modal" id="zoomModal" onclick="this.classList.remove('active')">
        <img src="" id="modalImg">
        <p style="position: absolute; bottom: 20px; font-weight: bold;">[ CLIQUEZ POUR FERMER ]</p>
    </div>

    <script>
        let cartItems = 0;
        const stripeLinks = {
            'Balotelli': 'https://buy.stripe.com/5kQbJ1dIFfSsbOw2YgeZ200',
            'Neymar': 'https://buy.stripe.com/14AfZhcEB35G6uc0Q8eZ202',
            'Pogba': 'https://buy.stripe.com/3cI3cveMJ35G05OeGYeZ201'
        };

        function toggleMenu() { document.getElementById('sideNav').classList.toggle('active'); }
        
        function openZoom(src) {
            const modal = document.getElementById('zoomModal');
            document.getElementById('modalImg').src = src;
            modal.classList.add('active');
        }

        function addToCart(id) {
            cartItems++;
            document.getElementById('cart-count').innerText = cartItems;
            alert(id + " ajouté au panier !");
        }

        function buyNow(id) {
            window.location.href = stripeLinks[id];
        }
    </script>
</body>
</html>
