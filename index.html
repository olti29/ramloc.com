<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMLOC | LABORATOIRES</title>
    <style>
        :root { --black: #000; --white: #fff; --font: 'Helvetica', 'Arial', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
        body { background: var(--white); color: var(--black); text-transform: uppercase; letter-spacing: -0.5px; }

        /* HEADER */
        header { padding: 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid black; position: sticky; top: 0; background: white; z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: 900; letter-spacing: -2px; cursor: pointer; }
        .cart-trigger { font-weight: 900; cursor: pointer; border-bottom: 2px solid black; padding-bottom: 2px; }

        /* MENU BURGER UNDERGROUND */
        .burger { cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .burger span { width: 25px; height: 3px; background: black; }

        /* GRID */
        .shop-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 0; border-bottom: 2px solid black; }
        .product-card { padding: 50px 20px; border-right: 1px solid #eee; display: flex; flex-direction: column; align-items: center; }
        
        .image-box { width: 100%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; background: #fdfdfd; cursor: crosshair; margin-bottom: 30px; }
        .image-box img { max-width: 85%; max-height: 85%; object-fit: contain; }

        .product-info h2 { font-size: 1.2rem; font-weight: 900; margin-bottom: 5px; }
        .product-info p { font-size: 1rem; margin-bottom: 20px; opacity: 0.6; }

        /* SELECT TAILLES */
        .size-selector { width: 100%; padding: 12px; border: 2px solid black; font-weight: 900; appearance: none; background: white; cursor: pointer; margin-bottom: 15px; text-align: center; }

        /* BOUTONS */
        .btn-main { width: 100%; padding: 18px; font-weight: 900; border: 2px solid black; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .add-btn { background: white; color: black; margin-bottom: 10px; }
        .buy-btn { background: black; color: white; }
        .btn-main:hover { opacity: 0.6; }

        /* PANIER COULISSANT */
        #cart-panel { position: fixed; right: -100%; top: 0; width: 400px; height: 100%; background: white; border-left: 3px solid black; z-index: 1000; transition: 0.4s ease-in-out; padding: 40px 20px; }
        #cart-panel.active { right: 0; }
        .cart-header { display: flex; justify-content: space-between; font-weight: 900; border-bottom: 2px solid black; padding-bottom: 15px; margin-bottom: 20px; }
        .cart-item { margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; border-bottom: 1px solid #eee; padding-bottom: 10px; }

        /* MODAL ZOOM MULTI-VUES */
        .modal { position: fixed; inset: 0; background: white; z-index: 2000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { max-width: 80%; max-height: 70%; object-fit: contain; }
        .view-switcher { margin-top: 30px; display: flex; gap: 20px; }
        .view-btn { padding: 10px 20px; border: 1px solid black; cursor: pointer; font-weight: 900; font-size: 0.8rem; }
        .view-btn:hover { background: black; color: white; }
        .close-modal { position: absolute; top: 30px; right: 30px; font-weight: 900; cursor: pointer; border-bottom: 2px solid black; }

        footer { padding: 80px 20px; text-align: center; font-weight: 900; font-size: 0.8rem; }
        .marquee { background: black; color: white; padding: 10px; font-size: 0.7rem; font-weight: 900; overflow: hidden; white-space: nowrap; }
    </style>
</head>
<body>

    <div class="marquee">RAMLOC LABORATOIRES • EDITION 1 • NO RESTOCK • 10 PCS PER SIZE •</div>

    <header>
        <div class="burger" onclick="alert('Menu Underground : Shooting / Archives / Socials')">
            <span></span><span></span><span></span>
        </div>
        <div class="logo">RAMLOC</div>
        <div class="cart-trigger" onclick="toggleCart()">CART (<span id="count">0</span>)</div>
    </header>

    <main class="shop-container">
        <div class="product-card">
            <div class="image-box" onclick="openGallery('Balotelli', 'Sans titre.jpeg', 'dos-balo.jpg')">
                <img src="Sans titre.jpeg" alt="Balotelli Face">
            </div>
            <div class="product-info">
                <h2>RAMLOC X BALOTELLI</h2>
                <p>40.00 EUR</p>
                <select class="size-selector" id="size-Balotelli">
                    <option>S - 10 LEFT</option><option>M - 10 LEFT</option><option>L - 10 LEFT</option><option>XL - 10 LEFT</option>
                </select>
                <button class="btn-main add-btn" onclick="addToCart('BALOTELLI', 'Sans titre.jpeg')">ADD TO CART</button>
                <button class="btn-main buy-btn" onclick="window.location.href='https://buy.stripe.com/5kQbJ1dIFfSsbOw2YgeZ200'">BUY IT NOW</button>
            </div>
        </div>

        <div class="product-card">
            <div class="image-box" onclick="openGallery('Neymar', 'neymar-noir.pnj.jpeg', 'dos-ney.jpg')">
                <img src="neymar-noir.pnj.jpeg" alt="Neymar Face">
            </div>
            <div class="product-info">
                <h2>RAMLOC X NEYMAR</h2>
                <p>40.00 EUR</p>
                <select class="size-selector" id="size-Neymar">
                    <option>S - 10 LEFT</option><option>M - 10 LEFT</option><option>L - 10 LEFT</option><option>XL - 10 LEFT</option>
                </select>
                <button class="btn-main add-btn" onclick="addToCart('NEYMAR', 'neymar-noir.pnj.jpeg')">ADD TO CART</button>
                <button class="btn-main buy-btn" onclick="window.location.href='https://buy.stripe.com/14AfZhcEB35G6uc0Q8eZ202'">BUY IT NOW</button>
            </div>
        </div>
    </main>

    <div id="cart-panel">
        <div class="cart-header">
            <span>YOUR CART</span>
            <span style="cursor:pointer" onclick="toggleCart()">[ CLOSE ]</span>
        </div>
        <div id="cart-list"></div>
        <div id="cart-total" style="margin-top:20px; font-weight:900;">TOTAL: 0.00 EUR</div>
        <button class="btn-main buy-btn" style="margin-top:30px;" onclick="alert('Redirection vers le Checkout...')">CHECKOUT</button>
    </div>

    <div class="modal" id="galleryModal">
        <span class="close-modal" onclick="closeGallery()">[ CLOSE ]</span>
        <img src="" class="modal-content" id="modalImg">
        <div class="view-switcher">
            <div class="view-btn" onclick="changeView('face')">FRONT</div>
            <div class="view-btn" onclick="changeView('back')">BACK</div>
            <div class="view-btn" onclick="changeView('both')">FULL VIEW</div>
        </div>
    </div>

    <footer>
        <p>RAMLOC LABORATOIRES — © 2026</p>
        <p style="opacity: 0.3; margin-top: 10px; font-size: 0.6rem;">DESIGNED FOR THE UNDERGROUND</p>
    </footer>

    <script>
        let cart = [];
        let currentImages = { face: '', back: '' };

        function toggleCart() { document.getElementById('cart-panel').classList.toggle('active'); }

        function addToCart(name, img) {
            const size = document.querySelector('select').value;
            cart.push({ name, size, img });
            updateCart();
            toggleCart(); // Ouvre le panier dès qu'on ajoute
        }

        function updateCart() {
            const list = document.getElementById('cart-list');
            const count = document.getElementById('count');
            list.innerHTML = '';
            cart.forEach((item, index) => {
                list.innerHTML += `<div class="cart-item">
                    ${item.name} - ${item.size} <br> 40.00 EUR
                </div>`;
            });
            count.innerText = cart.length;
            document.getElementById('cart-total').innerText = `TOTAL: ${cart.length * 40}.00 EUR`;
        }

        function openGallery(name, face, back) {
            currentImages.face = face;
            currentImages.back = back || face; // Si pas de dos, on remet la face
            document.getElementById('modalImg').src = face;
            document.getElementById('galleryModal').classList.add('active');
        }

        function closeGallery() { document.getElementById('galleryModal').classList.remove('active'); }

        function changeView(type) {
            const img = document.getElementById('modalImg');
            if(type === 'face') img.src = currentImages.face;
            if(type === 'back') img.src = currentImages.back;
            if(type === 'both') img.src = currentImages.face; // Ici tu pourrais mettre l'image combinée
        }
    </script>
</body>
</html>
